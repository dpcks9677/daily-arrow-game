name = "daily-arrow-auth"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
DISCORD_CLIENT_ID = "1549217749316804608"
# DISCORD_CLIENT_SECRET은 `wrangler secret put DISCORD_CLIENT_SECRET`으로 등록 (로컬 개발은 .dev.vars)

# 멀티플레이 WebSocket 중계 (방 단위 Durable Object)
[[durable_objects.bindings]]
name = "ROOM_RELAY"
class_name = "RoomRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomRelay"]

# 요청 빈도 제한 (Cloudflare Rate Limiting). period는 10 또는 60초만 허용된다.
# 바인딩이 없을 때를 대비해 코드에 isolate 메모리 리미터가 폴백으로 들어 있다.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 3000, period = 60 }

[[ratelimits]]
name = "RL_SCORE"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_PROFILE"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_RTDB"
namespace_id = "1004"
simple = { limit = 1500, period = 60 }
